plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.5.5")))

    implementation "io.github.cdagaming:DiscordIPC:0.11.3"
    implementation "net.lenni0451:Reflect:1.4.0"
    implementation "com.kohlschutter.junixsocket:junixsocket-core:2.10.1"

    compileOnly "maven.modrinth:sodium:mc26.2-0.9.2-fabric"
    compileOnly "maven.modrinth:entityculling:1.11.2"
    compileOnly "maven.modrinth:lithium:mc26.2-0.25.3-fabric"
    implementation files("libs/baritone-fabric-26.2.jar")

}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
    it.options.compilerArgs += ['-nowarn','-Xlint:none','-Xmaxerrs','100000','-Xmaxwarns','0']
}
