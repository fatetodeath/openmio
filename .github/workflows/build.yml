name: Build and Prerelease

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch }}
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace build
      - uses: actions/upload-artifact@v4
        with:
          name: openmio-26.2-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  prerelease:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: openmio-26.2-${{ github.run_number }}-${{ github.run_attempt }}
          path: release
      - name: Create checksums
        working-directory: release
        run: sha256sum *.jar > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          TAG: 26.2-build-${{ github.run_number }}.${{ github.run_attempt }}
          TITLE: OpenMio 26.2 build ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          gh release create "$TAG" release/*.jar release/SHA256SUMS.txt \
            --target "$COMMIT" \
            --title "$TITLE" \
            --generate-notes \
            --prerelease \
            --latest=false
